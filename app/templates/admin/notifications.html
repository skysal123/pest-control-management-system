{% extends "admin/_layout.html" %}

{% block admin_content %}
<h2 class="mb-4">Notifications</h2>

{% for n in notes %}
<div class="os-card p-3 mb-2">
  <div class="d-flex justify-content-between">
    <div>
      <strong>{{ n.message }}</strong>
      <span class="text-muted small ms-2">[{{ n.type }}]</span>
    </div>
    <small class="text-muted">{{ n.created_at.strftime('%d %b %Y, %H:%M') }}</small>
  </div>
  {% if n.link %}
    <a href="{{ n.link }}" class="small">Open →</a>
  {% endif %}
</div>
{% else %}
<p class="text-muted">No notifications.</p>
{% endfor %}
{% endblock %}

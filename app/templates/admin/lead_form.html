{% extends "admin/_layout.html" %}

{% block admin_content %}
<h2 class="mb-4">{{ 'Edit' if lead else 'New' }} Lead</h2>

<div class="os-card p-4">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Name *</label>
        <input type="text" name="name" class="form-control" required value="{{ lead.customer.name if lead else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone *</label>
        <input type="tel" name="phone" class="form-control" required value="{{ lead.customer.phone if lead else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ lead.customer.email if lead and lead.customer.email else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Source</label>
        <select name="source" class="form-select">
          {% for src in ['Website','WhatsApp','Phone Call','Referral'] %}
          <option value="{{ src }}" {% if lead and lead.source==src %}selected{% endif %}>{{ src }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-8">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" value="{{ lead.customer.address if lead and lead.customer.address else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" value="{{ lead.customer.city if lead and lead.customer.city else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Service Required</label>
        <select name="service_id" class="form-select">
          <option value="">— Select —</option>
          {% for s in services %}
          <option value="{{ s.id }}" {% if lead and lead.service_id==s.id %}selected{% endif %}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Preferred Date</label>
        <input type="date" name="preferred_date" class="form-control" value="{{ lead.preferred_date.isoformat() if lead and lead.preferred_date else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Message</label>
        <textarea name="message" rows="3" class="form-control">{{ lead.message if lead else '' }}</textarea>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary">Save Lead</button>
      <a href="{{ url_for('admin.leads') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

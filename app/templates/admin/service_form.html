{% extends "admin/_layout.html" %}

{% block admin_content %}
<h2 class="mb-4">{{ 'Edit' if service else 'Add' }} Service</h2>

<div class="os-card p-4">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Name *</label>
        <input type="text" name="name" class="form-control" required value="{{ service.name if service else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Slug</label>
        <input type="text" name="slug" class="form-control" value="{{ service.slug if service else '' }}" placeholder="auto from name">
      </div>
      <div class="col-12">
        <label class="form-label">Short Description</label>
        <input type="text" name="short_description" class="form-control" value="{{ service.short_description if service else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea name="description" rows="3" class="form-control">{{ service.description if service else '' }}</textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Benefits (one per line)</label>
        <textarea name="benefits" rows="4" class="form-control">{{ service.benefits if service else '' }}</textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Process (one per line)</label>
        <textarea name="process" rows="4" class="form-control">{{ service.process if service else '' }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label">FAQ (use "Q:" / "A:" prefix)</label>
        <textarea name="faq" rows="4" class="form-control">{{ service.faq if service else '' }}</textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Icon (Bootstrap-icons class)</label>
        <input type="text" name="icon" class="form-control" value="{{ service.icon if service else 'bi-bug-fill' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Job duration (minutes)</label>
        <input type="number" name="estimated_minutes" class="form-control" min="15" step="15"
               value="{{ service.estimated_minutes if service else 90 }}">
        <div class="form-text">How long one job of this service blocks a technician.</div>
      </div>
      {% if service %}
      <div class="col-md-4">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          <option value="ACTIVE" {% if service.status=='ACTIVE' %}selected{% endif %}>Active</option>
          <option value="INACTIVE" {% if service.status=='INACTIVE' %}selected{% endif %}>Inactive</option>
        </select>
      </div>
      {% endif %}
    </div>
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary">Save</button>
      <a href="{{ url_for('admin.services') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

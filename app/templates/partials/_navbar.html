<nav class="navbar navbar-expand-lg os-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('public.home') }}">
      <i class="bi bi-shield-shaded text-primary"></i>
      {{ business_name }}
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='public.home' %}active{% endif %}" href="{{ url_for('public.home') }}">Home</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='public.about' %}active{% endif %}" href="{{ url_for('public.about') }}">About</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint in ['public.services','public.service_detail'] %}active{% endif %}" href="{{ url_for('public.services') }}">Services</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='public.contact' %}active{% endif %}" href="{{ url_for('public.contact') }}">Contact</a></li>

        {% if current_user.is_authenticated %}
          {% if current_user.is_admin %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.dashboard') }}">Admin</a></li>
          {% elif current_user.is_technician %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('technician.dashboard') }}">My Jobs</a></li>
          {% endif %}
          <li class="nav-item ms-lg-2">
            <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('auth.logout') }}">
              <i class="bi bi-box-arrow-right"></i> Logout
            </a>
          </li>
        {% else %}
          <li class="nav-item ms-lg-2">
            <a class="btn btn-primary btn-sm" href="{{ url_for('auth.login') }}">
              <i class="bi bi-person-circle"></i> Login
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
